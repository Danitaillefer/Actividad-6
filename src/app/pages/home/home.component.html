<div class="container my-5">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
        @for (usuario of arrayUsuario(); track usuario._id) {
            <app-usuario-card [usuario]="usuario" (deleteEmit)="eventDelete($event)"></app-usuario-card>
        } @empty {
            <div class="col-12 text-center my-4">
                <p class="text-muted">No hay usuarios disponibles en esta página.</p>
            </div>
        }
    </div>

    <div class="d-flex justify-content-center align-items-center mt-5 gap-3">
        <button 
            class="btn btn-outline-primary px-4" 
            (click)="paginaAnterior()" 
            [disabled]="currentPage() === 1">
            Anterior
        </button>
        
        <span class="fw-bold">
            Página {{ currentPage() }} de {{ totalPages() || 1 }}
        </span>
        
        <button 
            class="btn btn-outline-primary px-4" 
            (click)="paginaSiguiente()" 
            [disabled]="currentPage() === totalPages() || totalPages() === 0">
            Siguiente
        </button>
    </div>
</div>
