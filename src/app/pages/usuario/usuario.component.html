<div class="h-100 w-100 p-3 p-md-4">
  
  <div class="card shadow-sm border-0 rounded-4 w-100 h-100 overflow-auto">
    
    <div class="row g-0 h-100">
      
      <div class="col-12 col-md-5 d-flex justify-content-center align-items-center bg-primary bg-opacity-10 py-5">
        <div class="rounded-circle bg-white shadow-sm d-flex justify-content-center align-items-center overflow-hidden border border-5 border-white" 
             style="width: 250px; height: 250px;">
          <img [src]="miUsuario()?.image" alt="Avatar" class="w-100 h-100" style="object-fit: cover;">
        </div>
      </div>

      <div class="col-12 col-md-7 d-flex align-items-center bg-white">
        
        <div class="w-100 p-4 p-md-5">
          
          <div class="mb-4">
            <h1 class="display-4 fw-bold text-dark mb-0">{{miUsuario()?.first_name}}</h1>
            <h2 class="display-6 fw-light text-secondary">{{miUsuario()?.last_name}}</h2>
          </div>

          <div class="fs-5 mb-5">
            <p class="mb-2">
              <span class="fw-bold">Username:</span> 
              <span class="text-muted ms-2">@{{miUsuario()?.username}}</span>
            </p>
            <p class="mb-0">
              <span class="fw-bold">Email:</span> 
              <span class="text-muted ms-2 text-break">{{miUsuario()?.email}}</span>
            </p>
          </div>

          <div class="d-flex flex-column flex-xl-row gap-2 w-100 shadow-sm">
            <button type="button" class="btn btn-outline-danger py-2 fw-bold flex-fill" (click)="deleteUsuario(miUsuario()?._id)">
              Eliminar
            </button>   
            <a [routerLink]="['/updateuser', miUsuario()?._id]" class="btn btn-outline-secondary py-2 fw-bold flex-fill">
              Actualizar
            </a>
            <a routerLink="/home" class="btn btn-dark py-2 fw-bold flex-fill">
              Volver
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
